services:
  # Web Service
  - type: web
    name: cyphex-dialer
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyphex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cyphex-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Worker Service
  - type: worker
    name: cyphex-dialer-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: celery -A config worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyphex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cyphex-redis
          property: connectionString

  # Redis (Now defined as a service of type keyvalue)
  - type: keyvalue
    name: cyphex-redis
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0 # Allows internal connection

# Database
databases:
  - name: cyphex-db
    plan: starter
