services:
  # Web Service (Django)
  - type: web
    name: cyphex-dialer
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyphex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cyphex-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Worker Service (Celery)
  - type: worker
    name: cyphex-dialer-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: celery -A config worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyphex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cyphex-redis
          property: connectionString

# Redis
redis:
  - name: cyphex-redis
    plan: starter
    ipAllowList:
      - source: internal

# Database
databases:
  - name: cyphex-db
    plan: starter
    accessControl:
      allowedServices:
        - name: cyphex-dialer
        - name: cyphex-dialer-worker
